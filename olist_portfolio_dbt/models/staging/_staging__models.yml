version: 2

models:
  - name: stg_orders
    description: >
      注文の基本情報。1行 = 1注文。生データ(raw.orders)からカラム名の整理のみを行う。
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved

  - name: stg_order_items
    description: 注文明細。1注文に複数商品が含まれる場合は複数行になる。
    columns:
      - name: order_id
        tests:
          - not_null

  - name: stg_order_payments
    description: 決済情報。分割払い(payment_installments)が多い点がブラジル特有。
    columns:
      - name: order_id
        tests:
          - not_null

  - name: stg_order_reviews
    description: >
      レビュー情報。order_id に重複投稿があるため、review_answer_timestamp が
      最新の1件のみを残すよう dedupe している。
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_customers
    description: >
      顧客の注文単位ID(customer_id)と、顧客を横断して一意に識別するID
      (customer_unique_id)を持つ。リピート率の算出には customer_unique_id を使用する。
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null

  - name: stg_products
    description: 商品マスタ。product_category_name に約610件の欠損あり(カテゴリ不明)。
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_sellers
    description: 出品者マスタ。
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_geolocation
    description: >
      郵便番号(先頭5桁)ごとの代表緯度経度。生データの重複を zip_code_prefix 単位で
      平均集約して正規化している。
    columns:
      - name: zip_code_prefix
        tests:
          - unique
          - not_null

  - name: stg_product_category_translation
    description: 商品カテゴリ名のポルトガル語→英語対応表。
