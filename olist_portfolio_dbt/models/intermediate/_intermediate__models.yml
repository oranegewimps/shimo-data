version: 2

models:
  - name: int_order_items_agg
    description: 注文明細(order_items)を注文単位(order_id)に集計した中間テーブル。
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: int_orders_enriched
    description: >
      注文を軸に、顧客情報・GMV・配送遅延・レビュースコアを結合した中核ファクトテーブル。
      marts層の全モデルはこのモデルを起点に作成する。
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
